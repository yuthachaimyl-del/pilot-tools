name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
    paths-ignore:
      - mel.json
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
env:
  PROJECT: crew-brief
  # Printed by tools/setup-auto-deploy.sh. Deploys are skipped until it is filled in.
  PROJECT_NUMBER: "152625331284"
jobs:
  deploy:
    # one code base, one Firebase site per airline (config.js picks the airline by hostname)
    strategy:
      fail-fast: false
      matrix:
        site: [coolcrew, tgcrew]
    concurrency: deploy-${{ matrix.site }}
    env:
      SITE: ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: check setup
        id: setup
        run: |
          if [ "$PROJECT_NUMBER" = "SET_ME" ]; then
            echo "::notice::Auto-deploy not set up yet: run tools/setup-auto-deploy.sh in Cloud Shell and fill PROJECT_NUMBER."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.setup.outputs.ready == 'true'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@${{ env.PROJECT }}.iam.gserviceaccount.com
          create_credentials_file: true
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - if: steps.setup.outputs.ready == 'true'
        run: bash tools/build-hosting.sh "$RUNNER_TEMP/fbdeploy-$SITE" "$SITE"
      - if: steps.setup.outputs.ready == 'true'
        name: create the hosting site if it does not exist yet
        working-directory: ${{ runner.temp }}/fbdeploy-${{ matrix.site }}
        run: |
          npx --yes firebase-tools@13.29.1 hosting:sites:get "$SITE" --project "$PROJECT" >/dev/null 2>&1 \
            || npx --yes firebase-tools@13.29.1 hosting:sites:create "$SITE" --project "$PROJECT" --non-interactive
      - if: steps.setup.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/fbdeploy-${{ matrix.site }}
        run: npx --yes firebase-tools@13.29.1 deploy --only hosting --project "$PROJECT" --non-interactive
      - if: steps.setup.outputs.ready == 'true'
        run: echo "::notice::Deployed https://$SITE.web.app"
