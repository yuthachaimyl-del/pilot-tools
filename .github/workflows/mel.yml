name: MEL dashboard snapshot
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: mel
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node tools/mel-scrape.mjs mel.json
      - name: commit
        run: |
          git config user.name "mel-bot"
          git config user.email "mel-bot@users.noreply.github.com"
          git add mel.json
          if ! git diff --cached --quiet -- mel.json; then
            git commit -m "mel.json: $(date -u +'%Y-%m-%d %H:%MZ')"
            git push
          fi
