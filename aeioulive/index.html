<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AEIOU Trader Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: account chips -> tabs -> summary strip -> per-account ledger cards; numbers right-aligned in mono */
  --paper:#f4f3ee; --card:#fffefa; --ink:#1c2024; --muted:#6b6f72; --line:#e2dfd5;
  --gold:#9a6d0c; --good:#16794c; --bad:#b83a26; --warn:#b7791f;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14171a; --card:#1c2024; --ink:#e9e6dc; --muted:#9a9c9a; --line:#2c3136;
  --gold:#d9a93a; --good:#43b47c; --bad:#ec6a52; --warn:#e0a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14171a; --card:#1c2024; --ink:#e9e6dc; --muted:#9a9c9a; --line:#2c3136;
  --gold:#d9a93a; --good:#43b47c; --bad:#ec6a52; --warn:#e0a640; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--f-body)}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:.2px;text-wrap:balance}
h1 b{color:var(--gold);font-weight:600}
.fresh{font-size:13px;color:var(--muted)}
.fresh.stale{color:var(--bad);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
.chip,.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;border-radius:0;background:none;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.total{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font-size:12.5px;color:var(--muted)} .tile .v{font-size:20px;font-weight:500}
.tile .s{font-size:12.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--line)}
.card.up{border-left-color:var(--good)} .card.down{border-left-color:var(--bad)} .card.old{opacity:.55}
.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h3 small{font-weight:400;color:var(--muted);font-size:12px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.bar{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.bar .t{display:flex;justify-content:space-between;color:var(--muted)}
.bar .g{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar .g i{display:block;height:100%;background:var(--good)}
.bar.w .g i{background:var(--warn)} .bar.c .g i{background:var(--bad)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chartbox{position:relative;height:260px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-weight:500;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.wk td{background:color-mix(in srgb,var(--gold) 10%,transparent);font-weight:600}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.buy{color:var(--good);border-color:var(--good)} .pill.sell{color:var(--bad);border-color:var(--bad)}
.pill.carry{color:var(--warn);border-color:var(--warn)}
.note{font-size:13px;color:var(--muted)}
.msg{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msg.err{border-left-color:var(--bad)}
.msg button{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:5px 12px}
select{font:inherit;font-size:13.5px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><b>AEIOU</b> Trader Live</h1>
    <div id="fresh" class="fresh">กำลังโหลดข้อมูล…</div>
  </header>
  <div id="msg" class="msg" hidden></div>
  <div class="row" id="chips" role="group" aria-label="เลือกบัญชี"></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-overview" data-tab="overview" aria-selected="true">ภาพรวม</button>
    <button class="tab" role="tab" id="t-open" data-tab="open" aria-selected="false">ไม้ที่เปิด</button>
    <button class="tab" role="tab" id="t-daily" data-tab="daily" aria-selected="false">รายวัน</button>
    <button class="tab" role="tab" id="t-history" data-tab="history" aria-selected="false">ประวัติ</button>
  </nav>

  <section id="v-overview">
    <div class="total" id="totals"></div>
    <div style="height:12px"></div>
    <div class="cards" id="cards"></div>
    <div style="height:12px"></div>
    <div class="panel">
      <h2>Equity ระหว่างวัน <span class="row"><button class="chip" id="r24" aria-pressed="true">24 ชม.</button><button class="chip" id="r7" aria-pressed="false">7 วัน</button></span></h2>
      <div class="chartbox"><canvas id="cIntra" aria-label="กราฟ equity ระหว่างวัน"></canvas></div>
      <div class="note">เส้นแสดง % เทียบทุนเริ่มของแต่ละบัญชี เพื่อให้เทียบบัญชีขนาดต่างกันได้</div>
    </div>
  </section>

  <section id="v-open" hidden>
    <div class="panel">
      <h2>ไม้ที่ถืออยู่ <span class="num" id="openSum"></span></h2>
      <div class="scroll"><table id="openTbl"></table></div>
      <div class="note">🔁 = Topstep พักไม้ช่วงตลาดปิด บอทจะเปิดกลับเอง (กำไรขาดทุนเป็นค่าประมาณ)</div>
    </div>
  </section>

  <section id="v-daily" hidden>
    <div class="panel">
      <h2>Equity รายวัน</h2>
      <div class="chartbox"><canvas id="cDaily" aria-label="กราฟ equity รายวัน"></canvas></div>
    </div>
    <div style="height:12px"></div>
    <div class="panel">
      <h2>กำไร/ขาดทุนรายวัน</h2>
      <div class="scroll"><table id="dailyTbl"></table></div>
    </div>
  </section>

  <section id="v-history" hidden>
    <div class="panel">
      <h2>ไม้ที่ปิดแล้ว <select id="botSel" aria-label="กรองตามบอท"></select></h2>
      <div class="total" id="histSum"></div>
      <div class="scroll"><table id="histTbl"></table></div>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const PID = "devbnbshwsibjupesywi", SRV = "Supabase", TOOL = "execute_sql";
const ACC = [
  {k:"EXN", name:"Exness", sub:"demo ×1.0"},
  {k:"FTMO", name:"FTMO", sub:"ทดลองสอบ 100K"},
  {k:"TSXP", name:"Topstep Practice", sub:"เงินจำลอง"},
  {k:"TSXC", name:"Topstep Combine", sub:"50K สอบจริง"}];
const COLORS = {EXN:"#2f6db5", FTMO:"#9a6d0c", TSXP:"#7a5ab8", TSXC:"#16794c"};
const NAME = Object.fromEntries(ACC.map(a => [a.k, a.name]));
const S = {sel:"ALL", tab:"overview", range:"24", fast:null, slow:null, fastAt:0, charts:{}};
try { S.tab = localStorage.getItem("gbl_tab") || "overview"; S.sel = localStorage.getItem("gbl_acc") || "ALL"; } catch (e) {}

const Q_FAST = `with l as (select distinct on (account) account, ts, balance, equity, open_pnl, start_balance from goldbot_equity order by account, ts desc)
select json_build_object('now', now(), 'latest', (select json_agg(l) from l),
 'pos', (select coalesce(json_agg(p order by account, pnl), '[]'::json) from goldbot_positions p),
 'st', (select coalesce(json_agg(s), '[]'::json) from goldbot_status s)) as j`;
const Q_SLOW = `select json_build_object(
 'daily', (select coalesce(json_agg(d order by day), '[]'::json) from goldbot_daily d),
 'i24', (select coalesce(json_agg(x), '[]'::json) from (select account, date_bin('5 minutes', ts, timestamptz '2000-01-01') t, round(avg(equity),2) e, max(start_balance) s from goldbot_equity where ts > now() - interval '24 hours' group by 1,2 order by 2) x),
 'i7', (select coalesce(json_agg(x), '[]'::json) from (select account, date_bin('30 minutes', ts, timestamptz '2000-01-01') t, round(avg(equity),2) e, max(start_balance) s from goldbot_equity where ts > now() - interval '7 days' group by 1,2 order by 2) x),
 'trades', (select coalesce(json_agg(t order by closed desc), '[]'::json) from (select * from goldbot_trades where status = 'closed' order by closed desc limit 500) t)) as j`;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fx = () => (S.fast?.st?.find(s => s.usdthb)?.usdthb) || 33.6;
const money = (v, sign=true) => v == null || isNaN(v) ? "—" : (sign && v > 0 ? "+" : v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const baht = v => v == null || isNaN(v) ? "" : (v > 0 ? "+" : v < 0 ? "−" : "") + "฿" + Math.round(Math.abs(v * fx())).toLocaleString("en-US");
const cls = v => v > 0.005 ? "pos" : v < -0.005 ? "neg" : "";
const px = v => v == null ? "—" : Number(v).toLocaleString("en-US", {maximumFractionDigits: Math.abs(v) < 50 ? 5 : 2});
const bkk = d => new Date(new Date(d).getTime() + 7 * 3600e3);
const dayStr = d => bkk(d).toISOString().slice(0, 10);
const shown = k => S.sel === "ALL" || S.sel === k;
const MARKET = s => { s = String(s || "").toUpperCase();
  return s.startsWith("XAU") || s.startsWith("MGC") || s.startsWith("GC") ? "ทอง" : s.includes("US500") || s.startsWith("MES") ? "S&P 500" :
    s.includes("US100") || s.includes("USTEC") || s.includes("NAS") || s.startsWith("MNQ") ? "Nasdaq" : s.includes("JP225") ? "Nikkei" :
    s.includes("EURUSD") ? "EUR/USD" : s; };

function parsePayload(res) {
  let p = res?.payload ?? res;
  if (p && typeof p === "object" && !Array.isArray(p) && typeof p.result === "string") p = p.result;
  if (typeof p === "string" && /^\s*\{/.test(p)) { try { const o = JSON.parse(p); if (typeof o?.result === "string") p = o.result; else p = o; } catch (e) {} }
  if (typeof p === "string") {
    const close = p.lastIndexOf("</untrusted-data-");
    if (close >= 0) { const open = p.lastIndexOf("<untrusted-data-", close); p = p.slice(p.indexOf(">", open) + 1, close); }
    p = JSON.parse(p.trim());
  }
  if (Array.isArray(p)) p = p[0];
  return p?.j ?? p;
}

/* ---------- derived numbers ---------- */
function latest(k) { return S.fast?.latest?.find(r => r.account === k); }
function status(k) { return S.fast?.st?.find(r => r.account === k); }
function dailyOf(k) { return (S.slow?.daily || []).filter(r => r.account === k).sort((a, b) => a.day < b.day ? -1 : 1); }
function mondayOf(dstr) { const d = new Date(dstr + "T00:00:00Z"); const w = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - w); return d.toISOString().slice(0, 10); }
function periodPL(k) {
  const L = latest(k); if (!L) return {};
  const today = dayStr(S.fast.now), mon = mondayOf(today), D = dailyOf(k), start = Number(L.start_balance);
  const before = cut => { const r = D.filter(x => x.day < cut).pop(); return r ? Number(r.equity) : start; };
  return {day: L.equity - before(today), week: L.equity - before(mon), all: L.equity - start};
}
</script>
<script>
/* ---------- rendering ---------- */
function renderChips() {
  const opts = [{k:"ALL", name:"ทั้งหมด"}, ...ACC];
  $("chips").innerHTML = opts.map(a => `<button class="chip" data-acc="${a.k}" aria-pressed="${S.sel === a.k}">${esc(a.name)}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { S.sel = b.dataset.acc; try { localStorage.setItem("gbl_acc", S.sel); } catch (e) {} renderAll(); });
}
function renderFresh() {
  if (!S.fast) return;
  const ts = Math.max(...(S.fast.latest || []).map(r => new Date(r.ts).getTime()));
  const age = (Date.now() - ts) / 1000, el = $("fresh");
  const t = bkk(ts).toISOString().slice(11, 16);
  el.className = "fresh" + (age > 300 ? " stale" : "");
  el.textContent = age > 300 ? `⚠ ข้อมูลล่าสุด ${Math.round(age / 60)} นาทีก่อน (${t} น.) · คอมอาจปิด/หลับ หรือ pusher หยุด`
    : `อัปเดต ${t} น. · ${age < 90 ? Math.round(age) + " วินาที" : Math.round(age / 60) + " นาที"}ก่อน · ดึงใหม่ทุก 1 นาที`;
}
function renderOverview() {
  if (!S.fast) return;
  const ks = ACC.filter(a => shown(a.k) && latest(a.k));
  const sum = f => ks.reduce((s, a) => s + (f(a.k) || 0), 0);
  const tot = {eq: sum(k => latest(k).equity), bal: sum(k => latest(k).balance), open: sum(k => latest(k).open_pnl),
    day: sum(k => periodPL(k).day), week: sum(k => periodPL(k).week), all: sum(k => periodPL(k).all)};
  const tile = (k, v, s, c) => `<div class="tile"><div class="k">${k}</div><div class="v num ${c || ""}">${v}</div><div class="s num">${s || ""}</div></div>`;
  $("totals").innerHTML =
    tile("กำไร/ขาดทุนจากทุนเริ่ม", money(tot.all), baht(tot.all), cls(tot.all)) +
    tile("วันนี้", money(tot.day), baht(tot.day), cls(tot.day)) +
    tile("สัปดาห์นี้", money(tot.week), baht(tot.week), cls(tot.week)) +
    tile("กำไรลอย (ไม้ที่เปิด)", money(tot.open), baht(tot.open), cls(tot.open)) +
    tile("Equity รวม", money(tot.eq, false), "Balance " + money(tot.bal, false));
  const now = new Date(S.fast.now).getTime();
  $("cards").innerHTML = ACC.filter(a => shown(a.k)).map(a => {
    const L = latest(a.k), st = status(a.k) || {};
    if (!L) return `<div class="card old"><h3>${esc(a.name)}<small>ยังไม่มีข้อมูล</small></h3></div>`;
    const p = periodPL(a.k), old = now - new Date(L.ts).getTime() > 300e3, npos = (S.fast.pos || []).filter(x => x.account === a.k).length;
    const bars = [];
    const bar = (lab, head, full) => { if (head == null) return; const r = Math.max(0, Math.min(1, head / full));
      bars.push(`<div class="bar ${r < .25 ? "c" : r < .5 ? "w" : ""}"><div class="t"><span>${lab}</span><span class="num">${money(head, false)} / ${money(full, false)}</span></div><div class="g"><i style="width:${(r * 100).toFixed(1)}%"></i></div></div>`); };
    if (a.k === "FTMO") { bar("ขาดทุนได้อีกวันนี้ (กฎ −5%)", st.headroom_day, 5000); bar("ขาดทุนได้อีกรวม (กฎ −10%)", st.headroom_total, 10000); }
    if (a.k === "EXN") { bar("ก่อน risk guard หยุดวันนี้ (−3.5%)", st.headroom_day, L.balance * 0.035); bar("ก่อน risk guard หยุดรวม (−8%)", st.headroom_total, 8000); }
    if (a.k.startsWith("TSX")) bar(a.k === "TSXC" ? "ห่างเส้นสอบตก (MLL)" : "ห่าง MLL ที่บอทนับ (ซ้อม)", st.headroom_total, 2000);
    return `<div class="card ${p.all >= 0 ? "up" : "down"} ${old ? "old" : ""}">
      <h3>${esc(a.name)}<small>${esc(a.sub)}${old ? " · ข้อมูลเก่า" : ""}</small></h3>
      <div class="kv">
        <span>Equity</span><span>${money(L.equity, false)}</span>
        <span>Balance</span><span>${money(L.balance, false)}</span>
        <span>กำไรลอย · ${npos} ไม้</span><span class="${cls(L.open_pnl)}">${money(L.open_pnl)}</span>
        <span>วันนี้</span><span class="${cls(p.day)}">${money(p.day)} <small>${baht(p.day)}</small></span>
        <span>สัปดาห์นี้</span><span class="${cls(p.week)}">${money(p.week)} <small>${baht(p.week)}</small></span>
        <span>จากทุนเริ่ม ${Math.round(L.start_balance / 1000)}K</span><span class="${cls(p.all)}">${money(p.all)} (${(p.all / L.start_balance * 100).toFixed(2)}%)</span>
      </div>${bars.join("")}</div>`;
  }).join("");
  renderIntra();
}
function lineChart(id, datasets, opt = {}) {
  const css = getComputedStyle(document.documentElement), ink = css.getPropertyValue("--muted").trim(), grid = css.getPropertyValue("--line").trim();
  if (S.charts[id]) S.charts[id].destroy();
  if (!window.Chart) return;
  const cv = $(id), box = cv.parentElement, w = Math.max(200, Math.floor(box.clientWidth || 300));
  if (!box.clientWidth) return;                       // hidden tab: draw when it is shown
  cv.style.width = w + "px"; cv.style.height = "260px"; cv.width = w; cv.height = 260;
  S.charts[id] = new Chart(cv, {type: "line", data: {datasets},
    options: {animation: false, responsive: false, maintainAspectRatio: false, parsing: false, interaction: {mode: "nearest", axis: "x", intersect: false},
      scales: {x: {type: "linear", ticks: {color: ink, maxTicksLimit: 6, callback: opt.xfmt}, grid: {color: grid}},
               y: {ticks: {color: ink, callback: opt.yfmt}, grid: {color: grid}}},
      plugins: {legend: {labels: {color: ink, boxWidth: 12}}, tooltip: {callbacks: {title: it => opt.xfmt(it[0].parsed.x), label: it => `${it.dataset.label}: ${opt.tip(it.parsed.y, it.raw)}`}}}}});
}
function renderIntra() {
  if (!S.slow) return;
  const rows = S.slow[S.range === "24" ? "i24" : "i7"] || [];
  const ds = ACC.filter(a => shown(a.k)).map(a => ({label: a.name, borderColor: COLORS[a.k], backgroundColor: COLORS[a.k], pointRadius: 0, borderWidth: 1.8,
    data: rows.filter(r => r.account === a.k).map(r => ({x: new Date(r.t).getTime(), y: (r.e / r.s - 1) * 100, e: r.e}))})).filter(d => d.data.length);
  const f = x => { const d = bkk(x).toISOString(); return S.range === "24" ? d.slice(11, 16) : d.slice(8, 10) + "/" + d.slice(5, 7) + " " + d.slice(11, 13) + "น."; };
  lineChart("cIntra", ds, {xfmt: f, yfmt: v => v.toFixed(2) + "%", tip: (y, raw) => `${y.toFixed(2)}% · ${money(raw.e, false)}`});
}
</script>
<script>
function renderOpen() {
  if (!S.fast) return;
  const P = (S.fast.pos || []).filter(p => shown(p.account));
  const live = P.filter(p => p.state !== "carry"), sum = live.reduce((s, p) => s + Number(p.pnl || 0), 0);
  $("openSum").innerHTML = `<span class="${cls(sum)}">${money(sum)} ${baht(sum)}</span>`;
  if (!P.length) { $("openTbl").innerHTML = `<tr><td class="note">ไม่มีไม้ที่เปิดอยู่</td></tr>`; return; }
  $("openTbl").innerHTML = `<tr><th>บัญชี</th><th>บอท</th><th>ตลาด</th><th>ฝั่ง</th><th class="r">ขนาด</th><th class="r">เข้า</th><th class="r">SL</th><th class="r">TP</th><th class="r">กำไร/ขาดทุน</th><th class="r">฿</th></tr>` +
    P.map(p => `<tr><td>${esc(NAME[p.account] || p.account)}</td><td>${p.state === "carry" ? "🔁 " : ""}${esc(p.bot)}</td><td>${esc(MARKET(p.symbol))}</td>
      <td><span class="pill ${p.state === "carry" ? "carry" : String(p.side).toLowerCase()}">${esc(p.side)}${p.state === "carry" ? " · พัก" : ""}</span></td>
      <td class="r">${p.size}</td><td class="r">${px(p.entry)}</td><td class="r">${px(p.sl)}</td><td class="r">${px(p.tp)}</td>
      <td class="r ${cls(p.pnl)}">${money(Number(p.pnl))}</td><td class="r ${cls(p.pnl)}">${baht(Number(p.pnl))}</td></tr>`).join("");
}
function renderDaily() {
  if (!S.slow) return;
  const ks = ACC.filter(a => shown(a.k));
  const ds = ks.map(a => ({label: a.name, borderColor: COLORS[a.k], backgroundColor: COLORS[a.k], pointRadius: 2, borderWidth: 1.8,
    data: dailyOf(a.k).map(r => ({x: new Date(r.day + "T00:00:00Z").getTime(), y: Number(r.equity)}))})).filter(d => d.data.length);
  const single = ks.length === 1;
  const start = Object.fromEntries(ACC.map(a => [a.k, Number(latest(a.k)?.start_balance || 0)]));
  if (!single) ds.forEach((d, i) => { const k = ks.find(a => a.name === d.label).k; d.data = d.data.map(p => ({x: p.x, y: (p.y / start[k] - 1) * 100, e: p.y})); });
  const f = x => { const d = new Date(x).toISOString(); return d.slice(8, 10) + "/" + d.slice(5, 7); };
  lineChart("cDaily", ds, {xfmt: f, yfmt: v => single ? "$" + Math.round(v).toLocaleString("en-US") : v.toFixed(1) + "%",
    tip: (y, raw) => single ? money(y, false) : `${y.toFixed(2)}% · ${money(raw.e, false)}`});
  // table: one row per day (all shown accounts summed), P/L vs previous day, weekly subtotal rows
  const days = [...new Set((S.slow.daily || []).filter(r => shown(r.account)).map(r => r.day))].sort();
  const eqOn = (k, d) => { const r = dailyOf(k).filter(x => x.day <= d).pop(); return r ? Number(r.equity) : (latest(k) ? start[k] : 0); };
  const balOn = (k, d) => { const r = dailyOf(k).find(x => x.day === d); return r?.balance != null ? Number(r.balance) : null; };
  const rows = []; let prev = null, wk = null, wsum = 0;
  const flushWeek = () => { if (wk) rows.push(`<tr class="wk"><td>สัปดาห์ ${wk.slice(8, 10)}/${wk.slice(5, 7)}</td><td></td><td></td><td class="r ${cls(wsum)}">${money(wsum)}</td><td class="r ${cls(wsum)}">${baht(wsum)}</td></tr>`); };
  for (const d of days) {
    const eq = ks.reduce((s, a) => s + (latest(a.k) ? eqOn(a.k, d) : 0), 0);
    const bals = ks.map(a => balOn(a.k, d)); const bal = bals.every(b => b == null) ? null : bals.reduce((s, b) => s + (b || 0), 0);
    const base = prev ?? ks.reduce((s, a) => s + (latest(a.k) ? start[a.k] : 0), 0); const pl = eq - base; prev = eq;
    const m = mondayOf(d); if (m !== wk) { flushWeek(); wk = m; wsum = 0; } wsum += pl;
    rows.push(`<tr><td>${d.slice(8, 10)}/${d.slice(5, 7)}/${d.slice(0, 4)}</td><td class="r">${money(eq, false)}</td><td class="r">${bal == null ? "—" : money(bal, false)}</td><td class="r ${cls(pl)}">${money(pl)}</td><td class="r ${cls(pl)}">${baht(pl)}</td></tr>`);
  }
  flushWeek();
  $("dailyTbl").innerHTML = `<tr><th>วันที่</th><th class="r">Equity</th><th class="r">Balance</th><th class="r">กำไร/ขาดทุน</th><th class="r">฿</th></tr>` + rows.reverse().join("");
}
function renderHistory() {
  if (!S.slow) return;
  const T = (S.slow.trades || []).filter(t => shown(t.account));
  const bots = [...new Set(T.map(t => t.bot))].sort();
  const cur = $("botSel").value || "ALL";
  $("botSel").innerHTML = `<option value="ALL">ทุกบอท</option>` + bots.map(b => `<option ${b === cur ? "selected" : ""}>${esc(b)}</option>`).join("");
  const R = T.filter(t => cur === "ALL" || t.bot === cur);
  const w = R.filter(t => t.pnl > 0), l = R.filter(t => t.pnl < 0), net = R.reduce((s, t) => s + Number(t.pnl), 0);
  const gw = w.reduce((s, t) => s + Number(t.pnl), 0), gl = -l.reduce((s, t) => s + Number(t.pnl), 0);
  const tile = (k, v, c) => `<div class="tile"><div class="k">${k}</div><div class="v num ${c || ""}">${v}</div></div>`;
  $("histSum").innerHTML = tile("จำนวนไม้", R.length) + tile("ชนะ / แพ้", `${w.length} / ${l.length}`) + tile("Win %", R.length ? Math.round(w.length / R.length * 100) + "%" : "—") +
    tile("กำไรสุทธิ", money(net), cls(net)) + tile("PF", gl > 0 ? (gw / gl).toFixed(2) : "—");
  const dt = s => { if (!s) return "—"; const d = bkk(s).toISOString(); return `${d.slice(8, 10)}/${d.slice(5, 7)} ${d.slice(11, 16)}`; };
  $("histTbl").innerHTML = R.length ? `<tr><th>ปิดเมื่อ</th><th>บัญชี</th><th>บอท</th><th>ตลาด</th><th>ฝั่ง</th><th class="r">ขนาด</th><th class="r">เข้า → ออก</th><th class="r">กำไร/ขาดทุน</th><th>ผล</th></tr>` +
    R.map(t => `<tr><td>${dt(t.closed)}</td><td>${esc(NAME[t.account] || t.account)}</td><td>${esc(t.bot)}</td><td>${esc(MARKET(t.symbol))}</td>
      <td><span class="pill ${String(t.side).toLowerCase()}">${esc(t.side)}</span></td><td class="r">${t.size}</td><td class="r">${px(t.entry)} → ${px(t.exit)}</td>
      <td class="r ${cls(t.pnl)}">${money(Number(t.pnl))}</td><td>${t.pnl > 0 ? "ชนะ" : t.pnl < 0 ? "แพ้" : "เสมอ"}</td></tr>`).join("")
    : `<tr><td class="note">ยังไม่มีไม้ที่ปิด</td></tr>`;
}
function renderTabs() {
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  ["overview", "open", "daily", "history"].forEach(t => $("v-" + t).hidden = t !== S.tab);
}
function renderAll() { renderChips(); renderTabs(); renderFresh(); renderOverview(); renderOpen(); renderDaily(); renderHistory(); }
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; try { localStorage.setItem("gbl_tab", S.tab); } catch (e) {} renderAll(); });
$("r24").onclick = () => { S.range = "24"; $("r24").setAttribute("aria-pressed", true); $("r7").setAttribute("aria-pressed", false); renderIntra(); };
$("r7").onclick = () => { S.range = "7"; $("r7").setAttribute("aria-pressed", true); $("r24").setAttribute("aria-pressed", false); renderIntra(); };
$("botSel").onchange = renderHistory;
setInterval(renderFresh, 15000);
let rzT = null, lastW = window.innerWidth;
window.addEventListener("resize", () => { if (Math.abs(window.innerWidth - lastW) < 30) return; lastW = window.innerWidth; clearTimeout(rzT); rzT = setTimeout(() => { renderIntra(); renderDaily(); }, 300); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", renderAll);
</script>
<script>
/* ---------- data (public endpoint, read-only) ---------- */
const API = "https://devbnbshwsibjupesywi.supabase.co/functions/v1/goldbot-public";
function showMsg(html, kind) { const m = $("msg"); m.hidden = !html; m.className = "msg" + (kind === "err" ? " err" : ""); m.innerHTML = html || ""; }
async function refresh() {
  try {
    const r = await fetch(API, {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json(); S.fast = j.fast; S.slow = j.slow; S.fastAt = Date.now();
    showMsg(""); renderAll();
  } catch (e) {
    showMsg("ดึงข้อมูลไม่สำเร็จ (" + esc(e.message || e) + ") · จะลองใหม่ใน 1 นาที" + (S.fast ? " · ตัวเลขด้านล่างคือข้อมูลครั้งก่อน" : ""), "err");
    renderFresh();
  }
}
renderAll(); refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - S.fastAt > 55000) refresh(); });
</script>
